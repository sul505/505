<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>صحن الكبسة</title>
<style>
  :root { --bg: #1b1325; --fg: #fff6e6; --accent: #f2b33d; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--fg);
    font-family: system-ui, "Segoe UI", Tahoma, sans-serif; overflow: hidden; }
  canvas { display: block; width: 100vw; height: 100vh; touch-action: none; }
  #touch { position: fixed; inset: auto 0 12px 0; display: none; justify-content: space-between;
    padding: 0 16px; pointer-events: none; }
  #touch .group { display: flex; gap: 8px; pointer-events: auto; }
  #touch button { width: 58px; height: 58px; border-radius: 14px; border: 0; font-size: 20px;
    background: rgba(255,255,255,.18); color: var(--fg); }
  @media (pointer: coarse) { #touch { display: flex; } }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="touch" dir="ltr">
  <div class="group">
    <button data-k="KeyA">🚶◀</button><button data-k="KeyD">▶🚶</button><button data-k="Space">⤒</button>
  </div>
  <div class="group">
    <button data-k="ArrowLeft">↺</button><button data-k="ArrowRight">↻</button>
  </div>
</div>
<script>
(() => {
  const cv = document.getElementById('c');
  const ctx = cv.getContext('2d');
  let W = 0, H = 0, DPR = 1;
  function resize() {
    DPR = window.devicePixelRatio || 1;
    W = window.innerWidth; H = window.innerHeight;
    cv.width = W * DPR; cv.height = H * DPR;
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  }
  window.addEventListener('resize', resize); resize();

  // ---------- input ----------
  const keys = {};
  addEventListener('keydown', e => { keys[e.code] = true; if (e.code === 'Space') e.preventDefault(); if (e.code === 'KeyR') reset(); });
  addEventListener('keyup', e => { keys[e.code] = false; });
  document.querySelectorAll('#touch button').forEach(b => {
    const k = b.dataset.k;
    b.addEventListener('pointerdown', e => { e.preventDefault(); keys[k] = true; });
    ['pointerup', 'pointerleave', 'pointercancel'].forEach(t => b.addEventListener(t, () => { keys[k] = false; }));
  });
  cv.addEventListener('pointerdown', () => { if (state !== 'play') reset(); });

  // ---------- persistent fail counter ----------
  let fails = 0;
  try { fails = +localStorage.getItem('kabsa_fails') || 0; } catch (e) {}
  const saveFails = () => { try { localStorage.setItem('kabsa_fails', fails); } catch (e) {} };

  // ---------- world ----------
  const GOAL = 4200, GROUND = () => H - 90;
  let p, tray, obstacles, cats, grains, toasts, wind, shake, t, state, nextEvent, msg;

  function reset() {
    p = { x: 80, y: 0, vx: 0, vy: 0, ground: true };
    tray = { a: 0, w: 0, rice: 100 };
    obstacles = []; cats = []; grains = []; toasts = [];
    wind = 0; shake = 0; t = 0; state = 'play'; nextEvent = 6; msg = '';
    for (let x = 500; x < GOAL - 200; x += 260 + Math.random() * 280) {
      obstacles.push({ x, w: 30 + Math.random() * 40, h: 18 + Math.random() * 26 });
    }
    toast('وصّل الكبسة للعرس بدون ما ينكب الرز!');
  }

  function toast(text) { toasts.push({ text, life: 3 }); }

  const chatEvents = [
    () => { cats.push({ x: p.x + W * 0.6, dir: -1 }); toast('💬 الشات أرسل: !قطة 🐈'); },
    () => { wind = (Math.random() < .5 ? -1 : 1) * 1.6; setTimeout(() => wind = 0, 3000); toast('💬 الشات أرسل: !ريح 🌬️'); },
    () => { shake = 1.2; tray.w += (Math.random() - .5) * 3; toast('💬 الشات أرسل: !هزة 🫨'); },
    () => { obstacles.push({ x: p.x + 220, w: 50, h: 34 }); toast('💬 الشات أرسل: !مطب 🚧'); },
  ];

  function fail(reason) {
    if (state !== 'play') return;
    state = 'lose'; fails++; saveFails(); msg = reason; shake = 1;
    for (let i = 0; i < 80; i++) spill(6);
  }

  function spill(speed = 2) {
    const tx = p.x + Math.sin(tray.a) * 40, ty = p.y - 95;
    grains.push({ x: tx + (Math.random() - .5) * 40, y: ty, vx: Math.sin(tray.a) * speed * 60 + (Math.random() - .5) * 80,
      vy: -Math.random() * 120, life: 2 });
  }

  // ---------- update ----------
  function update(dt) {
    t += dt;
    if (state !== 'play') { updateGrains(dt); return; }

    // walk
    const dir = (keys.KeyD ? 1 : 0) - (keys.KeyA ? 1 : 0);
    const prevVx = p.vx;
    p.vx += (dir * 260 - p.vx) * Math.min(1, dt * 4);
    if (keys.Space && p.ground) { p.vy = -430; p.ground = false; tray.w += (Math.random() - .5) * 1.2; }
    p.vy += 1100 * dt;
    let nx = p.x + p.vx * dt;

    // obstacles block feet
    for (const o of obstacles) {
      if (p.y > -o.h + 2 && nx + 14 > o.x && nx - 14 < o.x + o.w) {
        if (p.x + 14 <= o.x + 1 || p.x - 14 >= o.x + o.w - 1) {
          if (Math.abs(p.vx) > 60) {
            tray.w += Math.sign(p.vx) * 2.4 * Math.min(1, Math.abs(p.vx) / 200 + .3);
            shake = .4; toast('💥 طق بالمطب!');
          }
          p.vx = 0; nx = p.x;
        }
      }
    }
    p.x = Math.max(20, nx);

    // ground / landing on obstacle tops
    let floor = 0;
    for (const o of obstacles) if (p.x + 14 > o.x && p.x - 14 < o.x + o.w) floor = Math.min(floor, -o.h);
    p.y += p.vy * dt;
    if (p.y >= floor) {
      if (!p.ground && p.vy > 200) tray.w += (Math.random() - .5) * p.vy * .006;
      p.y = floor; p.vy = 0; p.ground = true;
    } else p.ground = false;

    // tray: inverted pendulum
    const ax = (p.vx - prevVx) / Math.max(dt, 1e-3);
    const bal = (keys.ArrowRight ? 1 : 0) - (keys.ArrowLeft ? 1 : 0);
    tray.w += (Math.sin(tray.a) * 3.2 - ax * .0016 + bal * 5 + wind + Math.sin(t * 2.3) * .35) * dt;
    tray.w *= Math.pow(.35, dt);
    tray.a += tray.w * dt;

    const over = Math.abs(tray.a) - .3;
    if (over > 0) {
      tray.rice -= over * 45 * dt;
      if (Math.random() < over * 3) spill();
    }
    if (Math.abs(tray.a) > 1.15) fail('انقلب الصحن! 😱');
    if (tray.rice <= 0) { tray.rice = 0; fail('خلص الرز… وش بيأكلون المعازيم؟'); }

    // cats
    for (const c of cats) {
      c.x += c.dir * 170 * dt;
      if (!c.hit && Math.abs(c.x - p.x) < 24 && p.y > -20) {
        c.hit = true; tray.w += (Math.random() < .5 ? -1 : 1) * 3.2; shake = .6; toast('🐈 القطة دخلت بين رجولك!');
      }
    }
    cats = cats.filter(c => Math.abs(c.x - p.x) < W * 2);

    // chat events
    nextEvent -= dt;
    if (nextEvent <= 0) { chatEvents[Math.floor(Math.random() * chatEvents.length)](); nextEvent = 7 + Math.random() * 6; }

    if (p.x >= GOAL) { state = 'win'; msg = `وصلت الكبسة! بقى ${Math.round(tray.rice)}% من الرز 🎉`; }
    updateGrains(dt);
  }

  function updateGrains(dt) {
    for (const g of grains) { g.vy += 900 * dt; g.x += g.vx * dt; g.y = Math.min(g.y + g.vy * dt, 0); g.life -= dt; }
    grains = grains.filter(g => g.life > 0);
    for (const s of toasts) s.life -= dt;
    toasts = toasts.filter(s => s.life > 0).slice(-3);
    shake = Math.max(0, shake - dt * 2);
  }

  // ---------- draw ----------
  function draw() {
    const gy = GROUND();
    const camX = Math.max(0, p.x - W * .35);
    const sx = (Math.random() - .5) * shake * 14, sy = (Math.random() - .5) * shake * 14;

    const sky = ctx.createLinearGradient(0, 0, 0, H);
    sky.addColorStop(0, '#2b1d4a'); sky.addColorStop(1, '#f0915a');
    ctx.fillStyle = sky; ctx.fillRect(0, 0, W, H);

    ctx.save(); ctx.translate(-camX + sx, gy + sy);

    // houses (parallax-less background)
    for (let x = Math.floor(camX / 180) * 180 - 180; x < camX + W + 180; x += 180) {
      const h = 90 + ((x * 7919) % 70);
      ctx.fillStyle = '#d9b98c'; ctx.fillRect(x, -h, 140, h);
      ctx.fillStyle = '#7a5a3a'; ctx.fillRect(x + 20, -h + 20, 24, 24); ctx.fillRect(x + 90, -h + 20, 24, 24);
    }
    ctx.fillStyle = '#4a4a52'; ctx.fillRect(camX - 50, 0, W + 100, 200);
    ctx.fillStyle = '#e8e2d0';
    for (let x = Math.floor(camX / 80) * 80; x < camX + W; x += 80) ctx.fillRect(x, 40, 40, 6);

    // wedding hall
    ctx.fillStyle = '#fff1c9'; ctx.fillRect(GOAL, -220, 260, 220);
    ctx.fillStyle = '#c23b5a'; ctx.fillRect(GOAL + 100, -110, 60, 110);
    ctx.fillStyle = '#c23b5a'; ctx.font = 'bold 26px system-ui'; ctx.textAlign = 'center';
    ctx.fillText('قاعة الأفراح 💍', GOAL + 130, -235);

    // obstacles
    for (const o of obstacles) { ctx.fillStyle = '#f2b33d'; ctx.fillRect(o.x, -o.h, o.w, o.h);
      ctx.fillStyle = '#222'; for (let i = 0; i < o.w; i += 14) ctx.fillRect(o.x + i, -o.h, 7, o.h); }

    // cats
    ctx.font = '30px system-ui';
    for (const c of cats) { ctx.save(); ctx.translate(c.x, -4); ctx.scale(-c.dir, 1); ctx.fillText('🐈', 0, 0); ctx.restore(); }

    // player
    ctx.save(); ctx.translate(p.x, p.y);
    ctx.fillStyle = '#f7f7f2'; ctx.fillRect(-14, -60, 28, 60);           // thobe
    ctx.fillStyle = '#c98f63'; ctx.beginPath(); ctx.arc(0, -70, 11, 0, 7); ctx.fill(); // head
    ctx.fillStyle = '#d63b3b'; ctx.beginPath(); ctx.moveTo(-14, -72); ctx.lineTo(14, -72); ctx.lineTo(18, -50); ctx.lineTo(-18, -50); ctx.closePath(); ctx.fill(); // shemagh
    ctx.strokeStyle = '#c98f63'; ctx.lineWidth = 5;
    ctx.beginPath(); ctx.moveTo(-12, -55); ctx.lineTo(-20, -90); ctx.moveTo(12, -55); ctx.lineTo(20, -90); ctx.stroke(); // arms
    // tray
    ctx.translate(0, -92); ctx.rotate(tray.a);
    ctx.fillStyle = '#b8bcc4'; ctx.fillRect(-55, -4, 110, 8);
    const r = tray.rice / 100;
    ctx.fillStyle = '#e9a93a'; ctx.beginPath(); ctx.ellipse(0, -4, 48 * Math.max(.2, r), 26 * r + 2, 0, Math.PI, 0); ctx.fill();
    ctx.fillStyle = '#8a4b26'; ctx.beginPath(); ctx.ellipse(0, -10 - 22 * r, 14, 8, 0, 0, 7); ctx.fill(); // meat
    ctx.restore();

    // grains
    ctx.fillStyle = '#ffd36e';
    for (const g of grains) ctx.fillRect(g.x, g.y, 3, 3);
    ctx.restore();

    // HUD
    ctx.textAlign = 'right'; ctx.fillStyle = '#fff6e6'; ctx.font = 'bold 18px system-ui';
    ctx.fillText(`🍚 الرز: ${Math.round(tray.rice)}%`, W - 16, 30);
    ctx.fillText(`💀 الطيحات: ${fails}`, W - 16, 56);
    ctx.fillText(`📍 ${Math.max(0, Math.round((GOAL - p.x) / 10))} م للقاعة`, W - 16, 82);
    // balance meter
    const mw = Math.min(260, W - 40), mx = W / 2 - mw / 2;
    ctx.fillStyle = 'rgba(255,255,255,.2)'; ctx.fillRect(mx, 14, mw, 10);
    ctx.fillStyle = 'rgba(80,220,120,.5)'; ctx.fillRect(W / 2 - mw * .3 / 2.3, 14, mw * .6 / 2.3, 10);
    ctx.fillStyle = Math.abs(tray.a) > .3 ? '#ff5a5a' : '#fff';
    ctx.fillRect(W / 2 + (tray.a / 1.15) * mw / 2 - 3, 10, 6, 18);

    ctx.textAlign = 'left'; ctx.font = '14px system-ui'; ctx.fillStyle = 'rgba(255,246,230,.75)';
    ctx.fillText('A/D مشي · ←/→ وازن الصحن · Space قفز · R إعادة', 16, 30);

    ctx.textAlign = 'center'; ctx.font = 'bold 18px system-ui';
    toasts.forEach((s, i) => { ctx.globalAlpha = Math.min(1, s.life); ctx.fillStyle = '#fff6e6';
      ctx.fillText(s.text, W / 2, 70 + i * 28); });
    ctx.globalAlpha = 1;

    if (state !== 'play') {
      ctx.fillStyle = 'rgba(0,0,0,.55)'; ctx.fillRect(0, 0, W, H);
      ctx.fillStyle = state === 'win' ? '#9cf29c' : '#ff8a8a'; ctx.font = 'bold 32px system-ui';
      ctx.fillText(msg, W / 2, H / 2 - 10);
      ctx.fillStyle = '#fff6e6'; ctx.font = '18px system-ui';
      ctx.fillText('اضغط R أو المس الشاشة للإعادة', W / 2, H / 2 + 30);
    }
  }

  let last = performance.now();
  function frame(now) {
    const dt = Math.min(.033, (now - last) / 1000); last = now;
    update(dt); draw(); requestAnimationFrame(frame);
  }
  reset(); requestAnimationFrame(frame);
})();
</script>
</body>
</html>
