<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f766e">
<meta name="description" content="خرائط عُمان بدون إنترنت: ملاحة صوتية، طرق ترابية، تضاريس وكنتور، كاميرات السرعة، والمد والجزر.">
<title>خرائط عُمان</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="خرائط عُمان">
<link rel="stylesheet" href="vendor/maplibre-gl.css">
<link rel="stylesheet" href="app.css">
</head>
<body>
<div id="map" role="region" aria-label="الخريطة"></div>

<header id="top">
  <button class="fab" data-act="menu" aria-label="القائمة"><span data-icon="menu"></span></button>
  <div class="search">
    <span class="ico" data-icon="search"></span>
    <input id="q" type="text" inputmode="search" placeholder="ابحث عن مكان، قرية، جبل، وادي أو إحداثيات" autocomplete="off" aria-label="بحث" role="combobox" aria-autocomplete="list" aria-expanded="false">
    <button class="icon-btn" data-clear hidden aria-label="مسح"><span data-icon="close"></span></button>
    <ul class="suggest" role="listbox" hidden></ul>
  </div>
</header>
<div id="chips" class="chips" aria-live="polite"></div>

<div class="fabs" id="fabs">
  <button class="fab" data-act="panel" data-panel="layers" aria-label="طبقات الخريطة" title="الطبقات"><span data-icon="layers"></span></button>
  <button class="fab" data-act="north" id="northBtn" aria-label="اتجاه الشمال" title="الشمال"><span data-icon="north"></span></button>
  <button class="fab small-text" data-act="terrain3d" id="btn3d" aria-label="عرض ثلاثي الأبعاد" title="ثلاثي الأبعاد">3D</button>
  <button class="fab primary" data-act="locate" id="locBtn" aria-label="موقعي" title="موقعي"><span data-icon="locate"></span></button>
</div>

<div id="speedBox" class="speedbox" hidden>
  <div class="speed"><b id="spdVal">0</b><small>كم/س</small></div>
  <div class="limit" id="limitSign" hidden></div>
</div>

<div id="navTop" class="navtop" hidden>
  <div class="mv" id="navIcon"></div>
  <div class="mvtext">
    <div class="mvdist" id="navDist"></div>
    <div class="mvinstr" id="navInstr"></div>
  </div>
  <div class="then" id="navThen" hidden></div>
</div>
<div id="camAlert" class="camalert" hidden></div>
<div id="navBottom" class="navbottom" hidden>
  <button class="icon-btn" data-act="nav-stop" aria-label="إنهاء الملاحة"><span data-icon="close"></span></button>
  <div class="eta"><b id="navTime"></b><span id="navRemain"></span></div>
  <button class="icon-btn" data-act="nav-voice" id="voiceBtn" aria-label="الصوت"><span data-icon="volume"></span></button>
  <button class="icon-btn" data-act="nav-steps" aria-label="قائمة الاتجاهات"><span data-icon="list"></span></button>
  <button class="icon-btn" data-act="nav-overview" aria-label="عرض المسار كاملاً"><span data-icon="route"></span></button>
</div>

<section id="sheet" class="sheet" hidden aria-live="polite">
  <button class="grip" data-act="sheet-size" aria-label="تكبير / تصغير"></button>
  <div id="sheetBody" class="sheet-body"></div>
</section>

<div id="scrim" class="scrim" data-act="drawer-close" hidden></div>
<nav id="drawer" class="drawer" hidden aria-label="القائمة">
  <div class="drawer-head"><span class="logo" data-icon="logo"></span><div><b>خرائط عُمان</b><small>تعمل بدون إنترنت</small></div></div>
  <button data-act="panel" data-panel="offline"><span data-icon="download"></span>تنزيل الخرائط للاستخدام بدون نت</button>
  <button data-act="panel" data-panel="tides"><span data-icon="wave"></span>المد والجزر</button>
  <button data-act="panel" data-panel="tracks"><span data-icon="track"></span>المسارات والنقاط وGPX</button>
  <button data-act="panel" data-panel="tools"><span data-icon="ruler"></span>الأدوات: قياس، إحداثيات، عدّاد الرحلة</button>
  <button data-act="panel" data-panel="sun"><span data-icon="sun"></span>الشمس والقمر</button>
  <button data-act="panel" data-panel="layers"><span data-icon="layers"></span>الطبقات ونمط الخريطة</button>
  <button data-act="panel" data-panel="settings"><span data-icon="settings"></span>الإعدادات</button>
  <button data-act="panel" data-panel="about"><span data-icon="info"></span>المصادر والدقة</button>
</nav>

<div id="toast" class="toast" role="status" aria-live="polite"></div>
<script type="module" src="js/app.js"></script>
</body>
</html>
